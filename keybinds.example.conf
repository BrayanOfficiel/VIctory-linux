# Copy to `keybinds.conf` next to victory.exe, or point VICTORY_KEYBINDS at
# your own file. The running title notices edits within a second; no
# restart. Lines below are the built-in defaults, spelled out.
#
# One action per line. Several keys can share a button; analog actions
# take one key. An empty value unbinds. Unknown names only warn.

# Actions (pad controls):
#   A B X Y                 the face buttons
#   LB RB LS RS             shoulders, stick clicks
#   Start View              Menu and View
#   Up Down Left Right      the d-pad
#   LT RT                   the triggers
#   LeftStickUp ... RightStickRight   the stick axes

# Keys: letters, digits, Enter, Esc, Tab, Backspace, Space, arrows
# (Up Down Left Right), Shift, Ctrl, Alt, Home, End, PageUp, PageDown,
# Insert, Delete, Menu, F1 to F12.

A = Enter
B = Backspace
X = X
Y = Y
LB = Q
RB = E
LS = F
RS = H
Start = Esc
View = Tab
Up = Up
Down = Down
Left = Left
Right = Right
LT = Z
RT = C
LeftStickUp = W
LeftStickDown = S
LeftStickLeft = A
LeftStickRight = D
RightStickUp = I
RightStickDown = K
RightStickLeft = J
RightStickRight = L
